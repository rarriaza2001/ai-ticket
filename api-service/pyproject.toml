[project]
name = "api-service"
version = "0.1.0"
description = "HTTP API foundation (FastAPI, SQLAlchemy async, Redis)"
requires-python = ">=3.12"
dependencies = [
    "shared-contracts",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.4,<3",
    "structlog>=24,<26",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "redis[hiredis]>=5,<6",
    "pgvector>=0.3,<1",
]

[project.optional-dependencies]
dev = [
    "alembic>=1.13,<2",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "ruff>=0.6",
]
migrations = [
    "alembic>=1.13,<2",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
]
observability = [
    "opentelemetry-api>=1.25,<2",
]
test = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "alembic>=1.13,<2",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
]

[tool.uv.sources]
shared-contracts = { path = "../shared-contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "benchmark_tooling: Phase 4 seed/benchmark script unit tests (fast, no HTTP benchmark)",
]
