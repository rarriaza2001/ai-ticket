[project]
name = "ai-worker"
version = "0.1.0"
description = "Async worker for embeddings, routing, retrieval, and suggestions (Phase 2)"
requires-python = ">=3.12"
dependencies = [
    "shared-contracts",
    "structlog>=24,<26",
    "pydantic-settings>=2.4,<3",
    "asyncpg>=0.29,<1",
    "redis[hiredis]>=5,<6",
]

[tool.uv.sources]
shared-contracts = { path = "../shared-contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
