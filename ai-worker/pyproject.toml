[project]
name = "ai-worker"
version = "0.1.0"
description = "Background worker foundation (SQLAlchemy async connectivity, Redis)"
requires-python = ">=3.12"
dependencies = [
    "shared-contracts",
    "structlog>=24,<26",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "redis[hiredis]>=5,<6",
    "pgvector>=0.3,<1",
    "openai>=1.40,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "alembic>=1.13,<2",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
]

[tool.uv.sources]
shared-contracts = { path = "../shared-contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
