[project]
name = "shared-contracts"
version = "0.1.0"
description = "Shared foundation schemas (health/readiness) for triage services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared_contracts"]

[tool.ruff]
line-length = 100
target-version = "py312"
